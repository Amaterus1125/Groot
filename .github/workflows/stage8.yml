name: stage8
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    env:
      LFS: /mnt/lfs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - name: Host setup
        run: bash scripts/00-host-setup.sh
      - name: Restore stage7 and repair permissions
        run: |
          gh release download stage7 -p stage7.tar.zst
          # keep the numeric owners from the archive, then put root ownership and setuid bits back
          sudo tar --numeric-owner --zstd -xpf stage7.tar.zst -C $LFS
          rm stage7.tar.zst
          sudo bash scripts/fix-perms.sh $LFS
          mkdir -p logs
          sudo mkdir -p $LFS/sources
          sudo chown $(id -u):$(id -g) $LFS/sources
      - name: Download LFS sources (libffi)
        run: bash scripts/01-sources.sh
      - name: Download stage 8 sources
        run: bash scripts/19-sources-stg8.sh
      - name: Chroot Setup & Build
        run: sudo bash scripts/20-chroot-setup-stg8.sh
      - name: Unmount & Cleanup
        if: always()
        run: sudo bash scripts/22-unmount-stg8.sh
      - name: Verify
        run: |
          for f in passwd su mount; do
            got=$(sudo stat -c '%a %u' $LFS/usr/bin/$f)
            [ "$got" = "4755 0" ] || { echo "bad permissions on $f: $got"; exit 1; }
          done
          if sudo find $LFS/etc/ssh -name 'ssh_host_*' 2>/dev/null | grep -q .; then
            echo "SSH host keys found in the image"; exit 1
          fi
          left=$(sudo find $LFS -xdev -path $LFS/sources -prune -o -uid $(id -u) -print | head -n 5)
          [ -z "$left" ] || { echo "files still owned by the runner:"; echo "$left"; exit 1; }
          echo "permission checks passed"
      - name: Pack
        run: |
          sudo rm -f $LFS/wget.log
          sudo tar --numeric-owner -C $LFS --exclude=./sources -I 'zstd -T0 -12' -cpf stage8.tar.zst .
          ls -lh stage8.tar.zst
          sha256sum stage8.tar.zst
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stage8-logs, path: logs/ }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: stage8, files: stage8.tar.zst }
